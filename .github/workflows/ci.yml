name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when src/generated/openapi.ts differs from the hosted spec.
      # `--check` never writes the file, so later steps keep the committed
      # types. continue-on-error until docs.planeward.com serves the spec with
      # the app API v2 endpoints (channels, courses, progress, badges, events,
      # forms); remove it once that spec is deployed.
      - name: Check generated OpenAPI types
        continue-on-error: true
        env:
          PLANEWARD_OPENAPI: https://docs.planeward.com/openapi.json
        run: pnpm generate:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format
        run: pnpm format:check
